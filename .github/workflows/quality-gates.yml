# ==============================================================================
# QUALITY GATES
# ==============================================================================
name: Quality Gates

# ==============================================================================
# TRIGGERS
# ==============================================================================
on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    schedule:
        -   cron: 0 7 * * 1
    workflow_dispatch:

# ==============================================================================
# CONCURRENCY
# ==============================================================================
# The event name keeps scheduled and manual runs out of the push group, so a
# merge to master cannot cancel one part way through.
concurrency:
    group: quality-gates-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: read

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: SCOPED MUTATION GATE (PR + PUSH)
    # ==========================================================================
    mutation:
        if: ${{ github.event_name != 'schedule' }}
        name: Mutation / PHP 8.3
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false
                    fetch-depth: 0

            -   name: Fetch base branch for the diff
                run: git fetch --no-tags origin master

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v2.0.0
                with:
                    php-version: 8.3
                    coverage: pcov

            # On a push, origin/master is the pushed commit itself, so the gate
            # diffs against the commit master moved from. A push that rewrote
            # master instead of moving it forward leaves no such base.
            -   name: Scoped mutation gate
                env:
                    BEFORE: ${{ github.event.before }}
                run: |
                    base=origin/master
                    if [ "$GITHUB_EVENT_NAME" = push ]; then
                        if ! git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
                            echo "::error::master did not move forward from ${BEFORE}, so the changed lines are unknown; run the full mutation suite."
                            exit 1
                        fi
                        base=$BEFORE
                    fi
                    composer test:mutation -- --git-diff-base="$base"

    # ==========================================================================
    # JOB: FULL MUTATION COVERAGE (SCHEDULED + MANUAL)
    # ==========================================================================
    # The suite runs once, in parallel, to record which tests cover each line;
    # the mutation jobs below reuse it instead of each running the suite again.
    mutation-full-coverage:
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        name: Mutation Full Coverage / PHP 8.3
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v2.0.0
                with:
                    php-version: 8.3
                    coverage: pcov

            -   name: Record coverage
                run: composer test:mutation:coverage

            -   name: Upload coverage
                uses: actions/upload-artifact@v7
                with:
                    name: mutation-coverage
                    path: build/mutation-coverage
                    if-no-files-found: error
                    retention-days: 1

    # ==========================================================================
    # JOB: FULL MUTATION SUITE (SCHEDULED + MANUAL)
    # ==========================================================================
    # Each shard mutates every fourth source file, so the source is split
    # evenly and a new file joins a shard without any list to maintain.
    mutation-full:
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        needs: mutation-full-coverage
        name: Mutation Full / PHP 8.3 (${{ matrix.shard }}/4)
        runs-on: ubuntu-latest
        timeout-minutes: 60

        strategy:
            fail-fast: false
            matrix:
                shard: [ 1, 2, 3, 4 ]

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v2.0.0
                with:
                    php-version: 8.3
                    coverage: pcov

            -   name: Download coverage
                uses: actions/download-artifact@v8
                with:
                    name: mutation-coverage
                    path: build/mutation-coverage

            -   name: Full mutation suite
                env:
                    SHARD: ${{ matrix.shard }}
                run: |
                    files=$(find src -name '*.php' | LC_ALL=C sort | awk -v shard="$SHARD" 'NR % 4 == shard % 4' | paste -sd, -)
                    composer test:mutation:full -- --coverage=build/mutation-coverage --skip-initial-tests --filter="$files"

            -   name: Upload mutation report
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: mutation-full-${{ matrix.shard }}
                    path: build/infection-full*.log
                    if-no-files-found: warn

    # ==========================================================================
    # JOB: BENCHMARKS (SCHEDULED + MANUAL)
    # ==========================================================================
    benchmarks:
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        name: Benchmarks / PHP 8.3
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v2.0.0
                with:
                    php-version: 8.3

            -   name: Run PHPBench suite
                run: mkdir -p build && XDEBUG_MODE=off composer bench:ci 2>&1 | tee build/phpbench-console.txt

            -   name: Render benchmark summary
                if: always()
                run: |
                    echo '## PHPBench Summary' >> "$GITHUB_STEP_SUMMARY"
                    echo '```' >> "$GITHUB_STEP_SUMMARY"
                    cat build/phpbench-console.txt >> "$GITHUB_STEP_SUMMARY"
                    echo '```' >> "$GITHUB_STEP_SUMMARY"

            -   name: Upload benchmark artifact
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: phpbench-report
                    path: build/phpbench.xml
                    if-no-files-found: warn
